# Dependabot keeps the SHA-pinned GitHub Actions from rotting: every workflow
# action is pinned to a full commit SHA (with a trailing version comment) so a
# hijacked or force-moved tag cannot compromise CI. Dependabot proposes updates
# (new SHA + refreshed comment) on a weekly cadence.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week before proposing a freshly published release: a hijacked or
    # broken action version is usually yanked within days, before the pin moves
    # to it. Security updates are not delayed by a cooldown.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
