name: check-skills

# The skills document a CLI they do not ship, so they drift silently when gplay
# moves. This installs the latest gplay and resolves every documented command
# and flag against the real binary. No credential is needed: every check reads
# --help.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 07:00 UTC: catches drift introduced by a gplay release, not by a
    # commit here.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      log: ${{ steps.log.outputs.log }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install gplay
        run: |
          curl -fsSL https://gplay.sh/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report the version under test
        id: version
        run: |
          gplay version
          echo "version=$(gplay version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Check the skills against the binary
        id: check
        run: |
          set -o pipefail
          python3 scripts/check-skills.py 2>&1 | tee check.log

      # Hands the log to the report job, which alone holds issues: write.
      - name: Export the log
        id: log
        if: always() && github.event_name == 'schedule'
        run: |
          delim="EOF_$(openssl rand -hex 8)"
          { echo "log<<$delim"; cat check.log 2>/dev/null; echo "$delim"; } >> "$GITHUB_OUTPUT"

  # A red scheduled run has no author to notify, so it goes unnoticed for
  # days. Open (or refresh) one issue carrying the script's output instead;
  # it closes itself when a later scheduled run is green. Its own job so that
  # only it gets issues: write, and it runs no third-party code.
  report:
    needs: check
    if: always() && github.event_name == 'schedule' && needs.check.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      CHECK_LOG: ${{ needs.check.outputs.log }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the drift issue
        if: needs.check.result == 'failure'
        run: |
          title="skills drifted from $(printf "%s" "$VERSION" | cut -d"(" -f1 | sed "s/ *$//")"
          # shellcheck disable=SC2016 # literal Markdown fence, not an expansion
          body="$(printf '%s\n\n```\n%s\n```\n\nRun: %s' \
            "The Monday check found skills out of step with the installed gplay binary." \
            "$CHECK_LOG" \
            "$RUN_URL")"
          existing="$(gh issue list --label skills-drift --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label skills-drift
          fi

      - name: Close the drift issue when green again
        if: needs.check.result == 'success'
        run: |
          for n in $(gh issue list --label skills-drift --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Green again against $VERSION."
          done
